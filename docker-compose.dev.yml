services:
  api-dev:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: moto-promos-api-dev
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:admin123@postgres:5432/moto_promos
    volumes:
      - ./apps/api/src:/app/apps/api/src
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
