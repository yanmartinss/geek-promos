services:
  api-dev:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: geek-promos-api-dev
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geek_promos}
    volumes:
      - ./apps/api/src:/app/apps/api/src
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
